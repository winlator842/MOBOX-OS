name: Build MOBOX OS

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang llvm qemu-system-x86 xorriso

      - name: Build bootloader
        run: nasm -f bin boot.asm -o boot.bin

      - name: Build kernel
        run: |
          clang --target=i386 -ffreestanding -fno-stack-protector -nostdlib -c kernel.c -o kernel.o

      - name: Link kernel
        run: ld -m elf_i386 -T link.ld -o kernel.bin kernel.o

      - name: Create disk image
        run: cat boot.bin kernel.bin > mobox_os.img

      - name: Create bootable ISO
        run: |
          mkdir -p iso_root
          cp mobox_os.img iso_root/mobox_os.img
          xorriso -as mkisofs \
            -o mobox_os.iso \
            -b mobox_os.img \
            -no-emul-boot \
            -boot-load-size 1 \
            -boot-info-table \
            iso_root

      - name: Verify boot signature
        run: |
          xxd boot.bin | tail -1

      - name: Test ISO with QEMU
        run: |
          timeout 5 qemu-system-i386 -cdrom mobox_os.iso -no-reboot -display none -serial stdio 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobox_os
          path: |
            mobox_os.img
            mobox_os.iso
          retention-days: 14
