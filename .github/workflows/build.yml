on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang llvm qemu-system-x86

      - name: Build bootloader
        run: nasm -f bin boot.asm -o boot.bin

      - name: Build kernel
        run: clang --target=i386 -ffreestanding -fno-stack-protector -nostdlib -c kernel.c -o kernel.o

      - name: Link kernel
        run: ld -m elf_i386 -T link.ld -o kernel.bin kernel.o

      - name: Create disk image
        run: cat boot.bin kernel.bin > mobox_os.img

      - name: Test with QEMU
        run: |
          timeout 5 qemu-system-i386 -drive format=raw,file=mobox_os.img -no-reboot 2>&1 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobox_os
          path: mobox_os.img
          retention-days: 14
